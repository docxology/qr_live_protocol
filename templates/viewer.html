<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRLP - QR Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: auto;
            padding: 20px;
        }
        
        .qr-container {
            text-align: center;
            background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
            border: 2px solid #333;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.3);
            animation: pulse 3s ease-in-out infinite;
            max-width: 1200px;
            width: 100%;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 50px rgba(255, 0, 0, 0.3); }
            50% { box-shadow: 0 0 80px rgba(255, 0, 0, 0.6); }
        }
        
        .qr-title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
        }
        
        .qr-image {
            max-width: 500px;
            max-height: 500px;
            border: 4px solid #ff0000;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
            background: white;
            padding: 10px;
        }
        
        .qr-info {
            margin-top: 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            text-align: left;
            font-size: 1.1rem;
        }
        
        .info-item {
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
        }
        
        .info-label {
            color: #ff0000;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        
        .info-value {
            color: #fff;
            font-family: monospace;
            word-break: break-all;
        }
        
        .status-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            animation: blink 1s infinite;
            z-index: 1000;
        }
        
        .status-indicator.disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0.3; }
        }
        
        .timestamp {
            position: fixed;
            bottom: 20px;
            left: 20px;
            font-size: 1.2rem;
            color: #ff0000;
            font-family: monospace;
            z-index: 1000;
        }
        
        .loading {
            text-align: center;
            color: #ff0000;
            font-size: 1.5rem;
        }
        
        .sequence-number {
            position: fixed;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: #ff0000;
            font-family: monospace;
            z-index: 1000;
        }
        
        /* Editable Input Section */
        .custom-input-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 0, 0, 0.1);
            border: 2px solid #ff0000;
            border-radius: 10px;
        }
        
        .custom-input-title {
            color: #ff0000;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        
        .input-label {
            color: #ff0000;
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .input-field {
            width: 100%;
            padding: 10px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 5px;
            color: #fff;
            font-family: 'Courier New', monospace;
            font-size: 1rem;
        }
        
        .input-field:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.3);
        }
        
        .submit-button {
            background: #ff0000;
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Courier New', monospace;
        }
        
        .submit-button:hover {
            background: #cc0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
        }
        
        .submit-button:active {
            transform: scale(0.98);
        }
        
        /* QR Data Display Section */
        .qr-data-section {
            margin-top: 30px;
            padding: 20px;
            background: rgba(255, 0, 0, 0.05);
            border: 2px solid #333;
            border-radius: 10px;
            text-align: left;
        }
        
        .qr-data-title {
            color: #ff0000;
            font-size: 1.5rem;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        .qr-data-content {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #333;
            color: #fff;
            font-family: monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .qr-data-field {
            margin-bottom: 10px;
        }
        
        .qr-data-key {
            color: #ff0000;
            font-weight: bold;
        }
        
        .qr-data-value {
            color: #fff;
            margin-left: 10px;
        }
        
        @media (max-width: 768px) {
            .qr-container {
                padding: 20px;
                margin: 10px;
            }
            
            .qr-image {
                max-width: 90vw;
                max-height: 90vw;
            }
            
            .qr-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="status-indicator disconnected" id="statusIndicator" title="Connecting"></div>
    <div class="sequence-number" id="sequenceNumber">#0</div>
    <div class="timestamp" id="timestamp">Loading...</div>
    
    <div class="qr-container">
        <h1 class="qr-title">QR Live Protocol</h1>
        <div id="qrDisplay" class="loading">
            <p>🔄 Waiting for QR code...</p>
        </div>
        
        <form id="messageForm" method="post" class="custom-input-section">
            <div class="custom-input-title">📝 Custom QR Message</div>
            <div class="input-group">
                <label class="input-label" for="customMessage">Message</label>
                <input type="text" id="customMessage" class="input-field" maxlength="1000"
                       placeholder="Leave blank to clear the message">
            </div>
            {% if requires_admin_token %}
            <div class="input-group">
                <label class="input-label" for="adminToken">Admin token</label>
                <input type="password" id="adminToken" class="input-field" autocomplete="off" required>
            </div>
            {% endif %}
            <button class="submit-button" type="submit">Update next QR</button>
            <p id="messageStatus" role="status" aria-live="polite"></p>
        </form>

        <!-- QR Information Display -->
        <div class="qr-info" id="qrInfo" style="display: none;">
            <div class="info-item">
                <span class="info-label">Identity Hash:</span>
                <span class="info-value" id="identityHash">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Block Hashes Included:</span>
                <span class="info-value" id="blockchainInfo">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Time Servers:</span>
                <span class="info-value" id="timeServers">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Generated:</span>
                <span class="info-value" id="generatedTime">-</span>
            </div>
        </div>
        
        <!-- QR Data Details Section -->
        <div class="qr-data-section">
            <div class="qr-data-title">🔐 QR Data Details</div>
            <div class="qr-data-content" id="qrDataDetails">
                <div class="qr-data-field">
                    <span class="qr-data-key">Status:</span>
                    <span class="qr-data-value">Waiting for QR data...</span>
                </div>
            </div>
        </div>
    </div>

    {% include "_live_qr.html" %}
    <script nonce="{{ script_nonce }}">
        const byId = id => document.getElementById(id);
        const { connect, formatValue, renderImage, textElement } = qrlpLive;
        const form = byId('messageForm');

        function updateClock() {
            byId('timestamp').textContent = new Date().toISOString().slice(0, 19).replace('T', ' ') + ' UTC';
        }

        function detailRow(label, value) {
            const row = document.createElement('div');
            row.className = 'qr-data-field';
            row.append(
                textElement('span', 'qr-data-key', label + ':'),
                textElement('span', 'qr-data-value', value)
            );
            return row;
        }

        function renderFrame(frame) {
            if (!frame.qr_data || !renderImage(byId('qrDisplay'), frame.qr_image)) return;
            const data = frame.qr_data;
            byId('sequenceNumber').textContent = '#' + (data.sequence_number ?? 0);
            byId('identityHash').textContent = data.identity_hash ? data.identity_hash.slice(0, 16) + '…' : 'None';
            const chains = Object.entries(data.blockchain_hashes ?? {});
            const sources = Object.entries(data.time_server_verification ?? {});
            byId('blockchainInfo').textContent = chains.map(([chain]) => chain).join(', ') || 'None';
            byId('timeServers').textContent = sources.length + ' sources recorded';
            byId('generatedTime').textContent = data.timestamp ?? 'Unavailable';
            byId('qrInfo').style.display = 'grid';

            const rows = [detailRow('Timestamp', data.timestamp ?? 'Unavailable')];
            const fields = [
                ['Issuer', data.issuer_id],
                ['HMAC algorithm', data._hmac_algorithm],
                ['Signature algorithm', data.signature_algorithm],
                ['Encrypted fields', data._encrypted_fields?.join(', ')]
            ];
            if (!data._encrypted_fields?.includes('user_data')) fields.push(['User data', data.user_data]);
            for (const [label, value] of fields) {
                if (value != null) rows.push(detailRow(label, formatValue(value)));
            }
            for (const [chain, hash] of chains) rows.push(detailRow(chain, hash));
            for (const [source, status] of sources) rows.push(detailRow(source, formatValue(status)));
            byId('qrDataDetails').replaceChildren(...rows);
        }

        form.addEventListener('submit', async event => {
            event.preventDefault();
            const button = form.querySelector('button');
            const status = byId('messageStatus');
            button.disabled = true;
            status.textContent = 'Updating…';
            const headers = {'Content-Type': 'application/json'};
            if (byId('adminToken')) headers['X-QRLP-Admin-Token'] = byId('adminToken').value;
            try {
                const response = await fetch({{ url_for('update_user_data') | tojson }}, {
                    method: 'POST',
                    headers,
                    body: JSON.stringify({user_text: byId('customMessage').value})
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.message || result.error || 'Update failed');
                status.textContent = result.user_data ? 'Message saved for the next QR.' : 'Message cleared.';
            } catch (error) {
                status.textContent = error.message;
            } finally {
                button.disabled = false;
            }
        });

        updateClock();
        setInterval(updateClock, 1000);
        connect(renderFrame, connected => {
            const indicator = byId('statusIndicator');
            indicator.classList.toggle('disconnected', !connected);
            indicator.title = connected ? 'Connected' : 'Reconnecting…';
        });
    </script>
</body>
</html>
