<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Live Protocol - Live Display</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: #fff;
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            padding: 20px;
        }
        
        .header {
            text-align: center;
            padding: 30px 0;
            border-bottom: 2px solid #333;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 3rem;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            margin-bottom: 10px;
        }
        
        .header p {
            color: #fff;
            font-size: 1.2rem;
        }
        
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00;
            animation: pulse 2s infinite;
        }
        
        .status-dot.disconnected {
            background: #ff0000;
            box-shadow: 0 0 10px #ff0000;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        .qr-container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .qr-display {
            background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }
        
        .qr-display h2 {
            color: #ff0000;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .qr-image {
            max-width: 100%;
            height: auto;
            border: 4px solid #ff0000;
            border-radius: 10px;
            background: white;
            padding: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.3);
        }
        
        .qr-info {
            background: linear-gradient(45deg, #0a0a0a, #1a1a1a);
            border: 2px solid #333;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
        }
        
        .qr-info h2 {
            color: #ff0000;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        
        .info-item {
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            border-left: 4px solid #ff0000;
        }
        
        .info-label {
            color: #ff0000;
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        
        .info-value {
            color: #fff;
            word-break: break-all;
            font-size: 0.95rem;
        }
        
        .hash-display {
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            word-break: break-all;
            background: #0a0a0a;
            padding: 8px 12px;
            border-radius: 5px;
            margin: 5px 0;
            border: 1px solid #333;
        }
        
        .verification-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            margin: 2px;
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid #ff0000;
            color: #ff0000;
        }
        
        .verification-badge.verified {
            background: rgba(0, 255, 0, 0.2);
            border: 1px solid #00ff00;
            color: #00ff00;
        }
        
        .loading {
            text-align: center;
            color: #ff0000;
            font-size: 1.5rem;
            padding: 50px;
        }
        
        .timestamp-display {
            color: #ff0000;
            font-size: 1.1rem;
        }
        
        .sequence-badge {
            background: #ff0000;
            color: #fff;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .qr-container {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .status-bar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔐 QR Live Protocol</h1>
        <p>Live QR codes with verification metadata</p>
    </div>
    
    <div class="status-bar">
        <div class="status-indicator">
            <div class="status-dot disconnected" id="connectionStatus"></div>
            <span id="connectionText">Connecting...</span>
        </div>
        <div class="timestamp-display" id="currentTime">--:--:--</div>
        <div class="sequence-badge" id="sequenceNumber">#0</div>
    </div>
    
    <div class="qr-container">
        <div class="qr-display">
            <h2>📱 Live QR Code</h2>
            <div id="qrDisplay" class="loading">
                <p>🔄 Waiting for QR code...</p>
            </div>
        </div>
        
        <div class="qr-info">
            <h2>🔍 QR Payload</h2>
            <div id="qrInfo">
                <div class="info-item">
                    <span class="info-label">Status:</span>
                    <span class="info-value">Waiting for data...</span>
                </div>
            </div>
        </div>
    </div>

    {% include "_live_qr.html" %}
    <script nonce="{{ script_nonce }}">
        const byId = id => document.getElementById(id);
        const { connect, formatValue, renderImage, textElement } = qrlpLive;

        function updateClock() {
            byId('currentTime').textContent = new Date().toISOString().slice(11, 19) + ' UTC';
        }

        function infoItem(label, value, valueClass = 'info-value') {
            const row = document.createElement('div');
            row.className = 'info-item';
            row.append(textElement('span', 'info-label', label), textElement('div', valueClass, value));
            return row;
        }

        function renderFrame(frame) {
            if (!frame.qr_data || !renderImage(byId('qrDisplay'), frame.qr_image)) return;
            const data = frame.qr_data;
            const sequence = data.sequence_number ?? 0;
            byId('sequenceNumber').textContent = '#' + sequence;
            const rows = [
                infoItem('Sequence number', sequence),
                infoItem('Timestamp (UTC)', data.timestamp ?? 'Unavailable', 'info-value timestamp-display')
            ];
            if (data.identity_hash) rows.push(infoItem('Identity hash', data.identity_hash, 'hash-display'));
            if (data._hmac) rows.push(infoItem('HMAC', 'Present'));
            if (data.digital_signature) {
                rows.push(infoItem('Signature', data.signature_algorithm ?? 'Present'));
            }
            if (data._encrypted_fields?.length) {
                rows.push(infoItem('Encrypted fields', data._encrypted_fields.join(', ')));
            }
            const chains = Object.keys(data.blockchain_hashes ?? {});
            rows.push(infoItem('Block hashes included', chains.join(', ') || 'None'));
            const timeSources = Object.keys(data.time_server_verification ?? {}).length;
            rows.push(infoItem('Time sources recorded', timeSources));
            if (data.user_data != null && !data._encrypted_fields?.includes('user_data')) {
                rows.push(infoItem('User data', formatValue(data.user_data), 'hash-display'));
            }
            byId('qrInfo').replaceChildren(...rows);
        }

        updateClock();
        setInterval(updateClock, 1000);
        connect(renderFrame, connected => {
            byId('connectionStatus').classList.toggle('disconnected', !connected);
            byId('connectionText').textContent = connected ? 'Connected' : 'Reconnecting…';
        });
    </script>
</body>
</html>
